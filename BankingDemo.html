<!DOCTYPE html>
<html>

<head>

<title>
Insecure Banking Demo
</title>


<meta charset="UTF-8">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fa;
    color: #333;
    line-height: 1.6;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #d35400;
    margin-bottom: 20px;
}

h2 {
    color: #2c3e50;
    margin-top: 25px;
    margin-bottom: 10px;
    border-left: 5px solid #d35400;
    padding-left: 10px;
}

form {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 15px;
}

input[type="text"],
input[type="password"],
input[name="amount"],
input[type="file"] {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
}

input[type="submit"],
button {
    background: #d35400;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

input[type="submit"]:hover,
button:hover {
    background: #b84300;
}

a {
    display: inline-block;
    margin: 5px 0;
    color: #2980b9;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

#commentBox,
#result {
    background: #fff;
    border-left: 4px solid #3498db;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    min-height: 40px;
}

small {
    color: #e74c3c;
    font-weight: bold;
}

hr {
    border: none;
    height: 2px;
    background: #ddd;
    margin: 25px 0;
}

footer {
    text-align: center;
    margin-top: 30px;
    padding: 15px;
    color: #666;
    font-size: 14px;
    border-top: 1px solid #ddd;
}

/* Demo warning boxes */
.warning {
    background: #fff3cd;
    border: 1px solid #ffeaa7;
    color: #856404;
    padding: 10px;
    border-radius: 6px;
    margin: 10px 0;
}

/* Responsive */
@media (max-width: 768px) {
    body {
        padding: 15px;
    }

    input[type="submit"],
    button {
        width: 100%;
    }
}
</style>
